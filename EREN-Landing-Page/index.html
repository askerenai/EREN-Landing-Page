<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EREN — RV Corporation</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-black text-white overflow-hidden">

  <!-- Background Glow -->
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <!-- Main Content -->
  <div class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative z-10">

    <!-- Company -->
    <p class="tracking-[6px] text-zinc-500 text-sm mb-4 uppercase">
      Built by RV Corporation
    </p>

    <!-- Logo -->
    <h1 class="text-6xl md:text-8xl font-bold tracking-widest mb-6 glow-text">
      EREN
    </h1>

    <!-- Headline -->
    <h2 class="text-3xl md:text-5xl font-semibold mb-6 max-w-4xl leading-tight">
      The Next Generation AI Is Coming.
    </h2>

    <!-- Sub Text -->
    <p class="text-zinc-400 max-w-2xl mb-10 text-lg leading-relaxed">
      An intelligent execution AI designed for the future.
    </p>

    <!-- Button -->
    <a href="#"
       class="main-btn px-8 py-4 rounded-full border border-white/20 bg-white/10 backdrop-blur-md transition duration-300 text-lg font-medium">
       Get Early Access
    </a>

    <!-- FOMO Text -->
    <p class="text-zinc-500 text-sm mt-4">
      The first 100 users will unlock early access.
    </p>

    <!-- Animated Status -->
    <div class="mt-12 text-zinc-500 text-sm typing">
      Initializing EREN...
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
