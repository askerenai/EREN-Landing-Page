<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>EREN — RV Corporation</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-black text-white overflow-hidden">

  <!-- Background Glow -->
  <div class="glow glow1"></div>
  <div class="glow glow2"></div>

  <!-- Main Content -->
  <div class="min-h-screen flex flex-col items-center justify-center text-center px-6 relative z-10">

    <!-- Company -->
    <p class="tracking-[6px] text-zinc-500 text-sm mb-4 uppercase">
      Built by RV Corporation
    </p>

    <!-- Logo -->
    <h1 class="text-6xl md:text-8xl font-bold tracking-widest mb-6 glow-text">
      EREN
    </h1>

    <!-- Headline -->
    <h2 class="text-3xl md:text-5xl font-semibold mb-6 max-w-4xl leading-tight">
      The Next Generation AI Is Coming.
    </h2>

    <!-- Sub Text -->
    <p class="text-zinc-400 max-w-2xl mb-10 text-lg leading-relaxed">
      An intelligent execution AI designed for the future.
    </p>

    <!-- EREN Waitlist Form -->
<form id="eren-waitlist-form" class="flex flex-col sm:flex-row gap-4 items-center justify-center mt-4 w-full max-w-md mx-auto z-20 relative">
  <input type="email" id="email-input" name="email" placeholder="Enter your email address" required 
         class="px-6 py-4 rounded-full border border-white/20 bg-transparent text-white placeholder-zinc-500 focus:outline-none focus:border-white w-full sm:w-auto flex-grow" />
  
  <button type="submit" id="submit-btn" 
          class="px-8 py-4 rounded-full border border-white/20 bg-white/10 backdrop-blur-md hover:bg-white/20 transition duration-300 text-lg font-medium whitespace-nowrap text-white cursor-pointer">
    Get Early Access
  </button>
</form>

<!-- Message Box -->
<p id="waitlist-message" class="mt-4 text-sm font-medium h-5 z-20 relative"></p>

<!-- EREN Backend Script -->
<script>
  const scriptURL = 'https://script.google.com/macros/s/AKfycbxpjSTFqJg5Rn94Snn050R88YDGihDYUc43vTO2k_TXD5H1TFoflBAoZ-N6NEvoXLhU9g/exec';
  const form = document.getElementById('eren-waitlist-form');
  const msg = document.getElementById('waitlist-message');
  const btn = document.getElementById('submit-btn');

  form.addEventListener('submit', e => {
    e.preventDefault();
    btn.innerHTML = "Processing...";
    
    const data = new FormData(form);

    fetch(scriptURL, { method: 'POST', body: data })
      .then(response => {
        msg.innerHTML = "Welcome to E.R.E.N. Waitlist! Check your email.";
        msg.className = "mt-4 text-sm font-medium text-green-400 z-20 relative";
        form.reset();
        btn.innerHTML = "Get Early Access";
      })
      .catch(error => {
        msg.innerHTML = "Something went wrong. Please try again.";
        msg.className = "mt-4 text-sm font-medium text-red-400 z-20 relative";
        btn.innerHTML = "Get Early Access";
      });
  });
</script>
    <!-- FOMO Text -->
    <p class="text-zinc-500 text-sm mt-4">
      The first 100 users will unlock early access.
    </p>

    <!-- Animated Status -->
    <div class="mt-12 text-zinc-500 text-sm typing">
      Initializing EREN...
    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
